name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    # macos-15 ships a Swift 6.x toolchain, which Package.swift requires.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -n "${DISPATCH_TAG:-}" ]]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$REF_NAME"
          fi
          [[ -n "$TAG" ]] || { echo "ERROR: could not resolve a tag." >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Show toolchain
        run: swift --version

      - name: Stamp version from tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          echo "Stamping CFBundleShortVersionString=$VERSION CFBundleVersion=${{ github.run_number }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Info.plist

      # --- Signing: import the Developer ID certificate into a temp keychain ---
      # Outputs (explicit, so later steps never rely on ternary expressions):
      #   have_cert  "true"/"false"
      #   timestamp  "1" when signing with a real cert (secure timestamp is
      #              required for notarization), else "0"
      #   identity   signing identity name to pass to codesign
      - name: Import signing certificate
        id: cert
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          CERT_IDENTITY: ${{ secrets.MACOS_CERT_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${CERT_P12:-}" ]]; then
            echo "No MACOS_CERT_P12 secret — building ad-hoc signed (not distributable)."
            {
              echo "have_cert=false"
              echo "timestamp=0"
              echo "identity="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/tabby-signing.keychain-db"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Prepend to the search list so codesign finds the identity.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning
          # Resolve the identity to sign with: prefer the secret, else the first
          # Developer ID Application cert in the imported keychain.
          IDENTITY="${CERT_IDENTITY:-}"
          if [[ -z "$IDENTITY" ]]; then
            IDENTITY="$(security find-identity -v -p codesigning \
              | sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' | head -n 1)"
          fi
          if [[ -z "$IDENTITY" ]]; then
            echo "ERROR: no Developer ID Application identity found after import." >&2
            exit 1
          fi
          echo "Signing identity: $IDENTITY"
          {
            echo "have_cert=true"
            echo "timestamp=1"
            echo "identity=$IDENTITY"
          } >> "$GITHUB_OUTPUT"

      # --- Notarization credentials (optional) ---
      # Two supported styles; either works with package-dmg.sh:
      #   * App Store Connect API key: APPSTORE_API_KEY_ID/_ISSUER_ID/_PRIVATE_KEY
      #   * Apple ID + app-specific password: APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD
      # notarytool --key needs a .p8 FILE path, so the API-key content is
      # materialized into $RUNNER_TEMP and its path emitted as key_path.
      # Output: key_path — path to the .p8, empty when API-key auth is unavailable.
      - name: Write notarization API key
        id: notary
        env:
          P8: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${P8:-}" || -z "${KEY_ID:-}" || -z "${ISSUER_ID:-}" ]]; then
            echo "App Store Connect API key not configured — will use Apple ID auth if present."
            echo "key_path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$P8" > "$RUNNER_TEMP/notary_key.p8"
          echo "key_path=$RUNNER_TEMP/notary_key.p8" >> "$GITHUB_OUTPUT"

      # --- Build + sign (hardened runtime, secure timestamp when cert present) ---
      - name: Build app
        env:
          TABBY_NO_OPEN: "1"
          TABBY_TIMESTAMP: ${{ steps.cert.outputs.timestamp }}
          TABBY_SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
        run: ./build-app.sh

      # --- Notarize + staple + DMG ---
      # package-dmg.sh picks API-key auth when all three APPSTORE_API_* are set,
      # else Apple ID auth when APPLE_ID/APPLE_TEAM_ID/APPLE_APP_PASSWORD are set,
      # else skips notarization.
      - name: Package DMG
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ steps.notary.outputs.key_path }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/package-dmg.sh

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/tabby-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary_key.p8"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tabby-${{ steps.tag.outputs.tag }}
          path: |
            dist/*.dmg
            dist/*.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.dmg dist/*.sha256 --clobber
          else
            gh release create "$TAG" dist/*.dmg dist/*.sha256 \
              --title "$TAG" --generate-notes
          fi
